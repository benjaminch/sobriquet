codecov:
  require_ci_to_pass: false
  precision: 2
  round: down
  layout: "reach,diff,flags,tree"
  show_carryforward_flags: false

coverage:
  precision: 2
  round: down
  range: "55...100"  # Show success between 55-100%

# Commit status checks
status:
  project:
    default:
      target: 55            # Overall coverage must be at least 55%
      threshold: 5          # Allow up to 5% drop in coverage
      base: auto            # Compare against base (main branch)
  patch:
    default:
      target: 70            # New code should have 70% coverage
      threshold: 5
  changes:
    default:
      enabled: true         # Check coverage changes

comment:
  layout: "reach,diff,flags,tree"
  behavior: default         # Comment on commits and PRs
  require_changes: false    # Comment even if no coverage changes
  require_base: yes         # Only comment on PRs with a base branch

# Flags for different test types
flags:
  unittests:
    carryforward: true
  integrationtests:
    carryforward: true

# Ignore files
ignore:
  - "tests/.*"              # Ignore test files themselves
  - "benches/.*"            # Ignore benchmarks
  - "examples/.*"           # Ignore examples

# Fixes for path issues
fixes:
  - "src/:src/"             # Fix paths if needed
