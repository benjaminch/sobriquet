name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ env.VERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from tag
        run: echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Validate version matches Cargo.toml
        run: |
          if ! grep -q "version = \"$VERSION\"" Cargo.toml; then
            echo "Tag version ($VERSION) does not match Cargo.toml" >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create $VERSION --draft --verify-tag --title $VERSION

  build-release:
    name: Build (${{ matrix.name }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - name: linux-armv7
            os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            cross: true

          # macOS
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            cross: false
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            cross: false

          # Windows
          - name: windows-x86_64-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
          - name: windows-x86_64-gnu
            os: windows-latest
            target: x86_64-pc-windows-gnu
            cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
         shell: bash
         run: |
           if [ "${{ matrix.cross }}" = "true" ]; then
             cross build --release --target ${{ matrix.target }}
           else
             cargo build --release --target ${{ matrix.target }}
           fi

       - name: Determine binary path
         shell: bash
         run: |
           if [[ "${{ matrix.os }}" == windows-* ]]; then
             echo "BIN=target/${{ matrix.target }}/release/alxrs.exe" >> $GITHUB_ENV
           else
             echo "BIN=target/${{ matrix.target }}/release/alxrs" >> $GITHUB_ENV
           fi

       - name: Strip binary (Unix)
         if: matrix.os != 'windows-latest' && !matrix.cross
         run: strip "$BIN"

      - name: Create archive name
        shell: bash
        run: |
          version="${{ needs.create-release.outputs.version }}"
          echo "ARCHIVE=alxrs-$version-${{ matrix.target }}" >> $GITHUB_ENV

      - name: Create archive directory
        shell: bash
        run: |
          mkdir -p "$ARCHIVE"
          cp "$BIN" "$ARCHIVE/"
          cp README.md LICENSE "$ARCHIVE/" 2>/dev/null || cp README.md "$ARCHIVE/"

      - name: Create archive (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          7z a "$ARCHIVE.zip" "$ARCHIVE"
          certutil -hashfile "$ARCHIVE.zip" SHA256 > "$ARCHIVE.zip.sha256"
          echo "ASSET=$ARCHIVE.zip" >> $GITHUB_ENV
          echo "ASSET_SUM=$ARCHIVE.zip.sha256" >> $GITHUB_ENV

      - name: Create archive (Unix)
        if: "!startsWith(matrix.os, 'windows')"
        shell: bash
        run: |
          tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
          echo "ASSET=$ARCHIVE.tar.gz" >> $GITHUB_ENV
          echo "ASSET_SUM=$ARCHIVE.tar.gz.sha256" >> $GITHUB_ENV

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${{ needs.create-release.outputs.version }}"
          gh release upload "$version" "$ASSET" "$ASSET_SUM"

  # Publish to crates.io
  publish:
    name: Publish to crates.io
    needs: [create-release, build-release]
    runs-on: ubuntu-latest
    steps:
       - name: Checkout repository
         uses: actions/checkout@v4

       - name: Install Rust toolchain
         uses: dtolnay/rust-toolchain@stable

       - name: Publish to crates.io
         env:
           CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
         run: cargo publish

  # Update Homebrew tap
  homebrew-tap:
    name: Update Homebrew Tap
    needs: [create-release, build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger homebrew-alx repository workflow
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          version="${{ needs.create-release.outputs.version }}"
          gh workflow run update-formula.yml \
            -R benjaminch/homebrew-alx \
            -f version="$version"
