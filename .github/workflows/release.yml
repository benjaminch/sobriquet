name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ env.VERSION }}
      tag: ${{ env.TAG }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from tag
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Validate version matches Cargo.toml
        run: |
          if ! grep -q "version = \"$VERSION\"" Cargo.toml; then
            echo "Tag version ($VERSION) does not match Cargo.toml" >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create $TAG --draft --verify-tag --title $VERSION

  build-release:
    name: Build (${{ matrix.name }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - name: linux-armv7
            os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            cross: true

          # macOS
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            cross: false
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Determine binary path
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            echo "BIN=target/${{ matrix.target }}/release/sobriquet.exe" >> $GITHUB_ENV
          else
            echo "BIN=target/${{ matrix.target }}/release/sobriquet" >> $GITHUB_ENV
          fi

      - name: Strip binary (Unix)
        if: matrix.os != 'windows-latest' && !matrix.cross
        run: strip "$BIN"

      - name: Create archive name
        shell: bash
        run: |
          version="${{ needs.create-release.outputs.version }}"
          echo "ARCHIVE=sobriquet-$version-${{ matrix.target }}" >> $GITHUB_ENV

      - name: Create archive directory
        shell: bash
        run: |
          mkdir -p "$ARCHIVE"
          cp "$BIN" "$ARCHIVE/"
          cp README.md LICENSE "$ARCHIVE/" 2>/dev/null || cp README.md "$ARCHIVE/"

      - name: Create archive (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          7z a "$ARCHIVE.zip" "$ARCHIVE"
          certutil -hashfile "$ARCHIVE.zip" SHA256 > "$ARCHIVE.zip.sha256"
          echo "ASSET=$ARCHIVE.zip" >> $GITHUB_ENV
          echo "ASSET_SUM=$ARCHIVE.zip.sha256" >> $GITHUB_ENV

      - name: Create archive (Unix)
        if: "!startsWith(matrix.os, 'windows')"
        shell: bash
        run: |
          tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
          echo "ASSET=$ARCHIVE.tar.gz" >> $GITHUB_ENV
          echo "ASSET_SUM=$ARCHIVE.tar.gz.sha256" >> $GITHUB_ENV

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ needs.create-release.outputs.tag }}"
          gh release upload "$tag" "$ASSET" "$ASSET_SUM"

  publish:
    name: Publish to crates.io
    needs: [create-release, build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty || echo "Crate already published"
        continue-on-error: true

  homebrew-tap:
    name: Update Homebrew Tap
    needs: [create-release, build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sobriquet repository
        uses: actions/checkout@v4
        with:
          path: sobriquet

      - name: Checkout homebrew-tap repository
        uses: actions/checkout@v4
        with:
          repository: benjaminch/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Calculate source SHA256 and generate formula
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          cd homebrew-tap
          
          # Download source and calculate SHA256
          SOURCE_URL="https://github.com/benjaminch/sobriquet/archive/refs/tags/${TAG}.tar.gz"
          curl -L -o /tmp/source.tar.gz "$SOURCE_URL"
          SOURCE_SHA=$(shasum -a 256 /tmp/source.tar.gz | awk '{print $1}')
          
          # Generate formula without bottles (users will build from source)
          cat > Formula/sobriquet.rb << 'FORMULA_EOF'
          class Sobriquet < Formula
            desc "Fuzzy finder for shell aliases"
            homepage "https://github.com/benjaminch/sobriquet"
            url "https://github.com/benjaminch/sobriquet/archive/refs/tags/$TAG.tar.gz"
            sha256 "$SOURCE_SHA"
            license "MIT"
          
            depends_on "rust" => :build
          
            def install
              system "cargo", "install", "--locked", "--root", prefix, "--path", "."
            end
          
            def post_install
              puts "To set up shell integration, add this to your shell profile:"
              puts "eval \"$(#{bin}/sobriquet init zsh)\"   # for zsh"
              puts "eval \"$(#{bin}/sobriquet init bash)\"  # for bash"
              puts "#{bin}/sobriquet init fish | source      # for fish"
            end
          
            test do
              system "#{bin}/sobriquet", "--version"
            end
          end
          FORMULA_EOF
          
          # Replace placeholders with actual values
          sed -i.bak "s|\$TAG|${TAG}|g" Formula/sobriquet.rb
          sed -i.bak "s|\$SOURCE_SHA|${SOURCE_SHA}|g" Formula/sobriquet.rb
          rm Formula/sobriquet.rb.bak

      - name: Commit and push formula update
        working-directory: homebrew-tap
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Formula/sobriquet.rb
          git diff --cached --quiet || (git commit -m "chore: update sobriquet formula to ${{ needs.create-release.outputs.version }}" && git push origin main) || echo "Could not push (homebrew-tap may be in different org)"
        continue-on-error: true

  finalize-release:
    name: Finalize Release
    needs: [create-release, build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.create-release.outputs.tag }}"
          gh release edit "$tag" --draft=false
