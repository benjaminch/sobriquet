name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.3.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $VERSION"
            echo "Version must be in format: MAJOR.MINOR.PATCH (e.g., 0.3.0)"
            exit 1
          fi

      - name: Check if version already exists
        run: |
          VERSION="${{ inputs.version }}"
          if git tag | grep -q "^v${VERSION}$"; then
            echo "Version v${VERSION} already exists"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Update version in Cargo.toml
        run: |
          VERSION="${{ inputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      - name: Update Cargo.lock
        run: cargo update --workspace

      - name: Run tests
        run: cargo test --all-features

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ inputs.version }}"
          PREV_TAG=$(git tag --sort=-version:refname | head -1 || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            echo "First release"
            CHANGELOG="Initial release of sobriquet v$VERSION"
          else
            echo "Generating changelog from $PREV_TAG to HEAD"
            CHANGELOG=$(git log --pretty=format:"- %s" "$PREV_TAG..HEAD" | head -20)
          fi
          
          # Save changelog
          {
            echo "## What's Changed in v$VERSION"
            echo ""
            echo "$CHANGELOG"
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...v$VERSION"
          } > /tmp/pr_body.md
          
          cat /tmp/pr_body.md

      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          BRANCH="release/v$VERSION"
          
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create and push branch
          git checkout -b "$BRANCH"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: release version $VERSION"
          git push origin "$BRANCH"
          
          # Create PR
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: release version $VERSION" \
            --body-file /tmp/pr_body.md \
            --label "release"
