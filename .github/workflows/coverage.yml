name: Coverage

on:
  push:
    branches:
      - main
      - master
  pull_request:

# Minimum permissions required
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage
        run: cargo tarpaulin --lib --bins --tests --out xml --output-dir coverage --timeout 300

      - name: Upload coverage to codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/cobertura.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true

      - name: Archive coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # Check coverage thresholds
  coverage-check:
    name: Coverage Thresholds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Check coverage thresholds
        run: |
          # Generate coverage and capture output
          # Include lib, bins, and tests to get comprehensive coverage
          cargo tarpaulin --lib --bins --tests --out xml --output-dir coverage --timeout 300 > /tmp/coverage.txt 2>&1
          
          # Extract coverage percentage from the summary line
          # Line format: "58.36% coverage, 635/1088 lines covered, ..."
          # Extract the first field (58.36%) and remove the % sign
          COVERAGE=$(grep "% coverage," /tmp/coverage.txt | awk '{print $1}' | sed 's/%//' | head -1)
          
          # Debug: print full output if extraction failed
          if [ -z "$COVERAGE" ]; then
            echo "❌ Could not extract coverage percentage!"
            echo "Full tarpaulin output (last 30 lines):"
            tail -30 /tmp/coverage.txt
            exit 1
          fi
          
          echo "📊 Overall coverage: ${COVERAGE}%"
          
          # Minimum threshold is 55%
          THRESHOLD=55
          
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Coverage is ${COVERAGE}%, below minimum threshold of ${THRESHOLD}%"
            exit 1
          else
            echo "✅ Coverage is ${COVERAGE}%, meets minimum threshold of ${THRESHOLD}%"
          fi
