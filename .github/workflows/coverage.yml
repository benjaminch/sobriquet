name: Coverage

on:
  push:
    branches:
      - main
      - master
  pull_request:

# Minimum permissions required
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage
        run: |
          # Generate tarpaulin coverage with both lib and test targets
          # Note: Integration tests ARE included in this measurement
          # Tarpaulin reports line-based coverage; Codecov may report lower due to LLVM granularity
          cargo tarpaulin --lib --bins --tests --out xml --output-dir coverage --timeout 300

      - name: Upload coverage to codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/cobertura.xml
          flags: unittests,integrationtests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true

      - name: Archive coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # Check coverage thresholds
  coverage-check:
    name: Coverage Thresholds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Check coverage thresholds
        run: |
          # Generate coverage and capture output
          # Include lib, bins, and tests to get comprehensive coverage
          cargo tarpaulin --lib --bins --tests --out stdout --timeout 300 > /tmp/coverage.txt 2>&1
          
          # Extract coverage percentage from the final summary line
          # Line format: "66.42% coverage, 724/1090 lines covered, +0.00% change in coverage"
          # Use grep with pattern to find the final coverage report, then extract the percentage
          COVERAGE=$(grep -E "^[0-9]+\.[0-9]+% coverage," /tmp/coverage.txt | tail -1 | sed 's/^\([0-9]*\.[0-9]*\)%.*/\1/')
          
          # Debug: print full output if extraction failed
          if [ -z "$COVERAGE" ]; then
            echo "❌ Could not extract coverage percentage!"
            echo "Full tarpaulin output (last 50 lines):"
            tail -50 /tmp/coverage.txt
            exit 1
          fi
          
          echo "📊 Overall coverage: ${COVERAGE}%"
          
          # Minimum threshold is 50%
          # Note: Using tarpaulin's measurement which includes lib, bins, and tests
          # Tarpaulin currently measures 66.42% coverage for this codebase
          # The codecov.io report may show different percentages due to their own calculation methods
          # Using 50% threshold which is conservative and accounts for CI environment variations
          THRESHOLD=50
          
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Coverage is ${COVERAGE}%, below minimum threshold of ${THRESHOLD}%"
            exit 1
          else
            echo "✅ Coverage is ${COVERAGE}%, meets minimum threshold of ${THRESHOLD}%"
          fi
