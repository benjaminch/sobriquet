[package]
name = "sobriquet"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Fuzzy finder for shell aliases"
license = "MIT"
repository = "https://github.com/benjaminch/sobriquet"
keywords = ["alias", "shell", "fuzzy-finder", "cli", "zsh"]
categories = ["command-line-utilities"]

[lib]
name = "sobriquet"
path = "src/lib.rs"

[[bin]]
name = "sobriquet"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "string"] }
clap_complete = "4.5"
dirs = "6.0"
owo-colors = "4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
skim = { version = "0.10", optional = true }
thiserror = "2.0"
toml = "0.8"

[features]
default = ["interactive"]
interactive = ["skim"]

[dev-dependencies]
criterion = "0.5"
assert_cmd = "2.0"
predicates = "3.1"

[[bench]]
name = "benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
panic = "abort"

[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Pedantic lints (opinionated, good practices)
pedantic = { level = "warn", priority = -1 }

# Specific pedantic lints to allow (too noisy)
must_use_candidate = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
doc_markdown = "allow"

# Restriction lints (very strict, opt-in)
clone_on_ref_ptr = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
filetype_is_file = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
format_push_string = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
missing_assert_message = "warn"
mutex_atomic = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
semicolon_outside_block = "warn"
str_to_string = "warn"
suspicious_xor_used_as_pow = "warn"
todo = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
verbose_file_reads = "warn"
unwrap_used = "deny"
